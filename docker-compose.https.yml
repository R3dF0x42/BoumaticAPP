services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: boumatic
      POSTGRES_USER: boumatic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir le mot de passe actuel de PostgreSQL dans .env}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boumatic -d boumatic"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_SSL: "false"
      PORT: 4000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Definir ADMIN_PASSWORD dans .env}
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: boumatic
      PGUSER: boumatic
      PGPASSWORD: ${POSTGRES_PASSWORD:?Definir le mot de passe actuel de PostgreSQL dans .env}
      TRUST_PROXY: "true"
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: "/api"
    restart: unless-stopped
    depends_on:
      - backend

  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Definir le domaine de l'application dans .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy-config:/config
    depends_on:
      - frontend
      - backend
