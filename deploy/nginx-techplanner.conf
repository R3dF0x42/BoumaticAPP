server {
    listen 80;
    server_name techplanner.fr;
    root /home/ubuntu/BoumaticAPP/Frontend/dist;
    index index.html;

    client_max_body_size 10m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api {
        proxy_pass http://127.0.0.1:4000;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4000;
    }

    location = /uploads {
        proxy_pass http://127.0.0.1:4000;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:4000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name 135.125.199.51;
    return 301 https://techplanner.fr$request_uri;
}
